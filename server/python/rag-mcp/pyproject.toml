[project]
name = "rag-mcp"
version = "0.1.0"
description = "OpsLens rag-mcp: 고객사별 계약서·런북·포스트모템 검색 도구와 원문 Resource"
requires-python = ">=3.12"
dependencies = [
    "fastmcp==4.1.1",
    "openai>=3.35,<4",
    "psycopg[binary]>=3.3,<3.4",
    "pgvector>=0.5,<0.6",
    "pyjwt[crypto]>=2.15,<3",   # 작업 토큰 검증 (fastmcp가 이미 가져오는 버전)
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
