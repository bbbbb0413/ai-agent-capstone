[project]
name = "indexer"
version = "0.1.0"
description = "OpsLens indexer: 근거 문서 Chunking → Embedding → Indexing (오프라인)"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.35,<4",
    "psycopg[binary]>=3.3,<3.4",
    "pgvector>=0.5,<0.6",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
