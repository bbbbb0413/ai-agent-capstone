spring:
  application:
    name: opslens-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/opslens}
    username: ${SPRING_DATASOURCE_USERNAME:opslens_app}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  flyway:
    schemas: app
    default-schema: app
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all   # 브로커가 기록을 확인한 뒤에 성공으로 본다 (SPEC-kafka-scale 4.3(1))
      properties:
        enable.idempotence: true   # 재전송해도 같은 메시지가 두 번 쌓이지 않는다
        delivery.timeout.ms: 5000  # KafkaTaskDispatcher가 기다리는 시간과 같다. 넘으면 Outbox Relay가 다시 보낸다
        request.timeout.ms: 3000
        max.block.ms: 3000         # 브로커가 없을 때 메타데이터를 기다리며 발행 스레드가 오래 멈추지 않게 한다
  mvc:
    async:
      request-timeout: -1   # SSE 연결은 작업이 끝날 때까지 유지한다

server:
  error:
    include-message: always   # 내부 API 오류 메시지를 business-mcp가 ToolError로 모델에 넘긴다

opslens:
  jwt-secret: ${JWT_SECRET:}
  jwt-ttl: 8h
  service-token: ${SERVICE_TOKEN:}
  alert-webhook-token: ${ALERT_WEBHOOK_TOKEN:}
  agent-url: ${AGENT_URL:http://localhost:8000}
  prometheus-url: ${PROMETHEUS_URL:http://prometheus:9090}   # 의존 대상 상태와 영향 분석. 로컬 실행 시 변경 가능
  dispatch-mode: ${DISPATCH_MODE:kafka}   # kafka(기본) | http
  kafka:
    partitions: ${KAFKA_PARTITIONS:3}   # 작업 토픽 파티션 수 (tasks.gold·silver·retry.*)
  auto-approve-allowed: ${AUTO_APPROVE_ALLOWED:true}   # true면 관리자가 화면에서 자동 승인을 켤 수 있다. 운영에서는 false
  kubernetes:
    credentials-dir: ${TENANT_CREDENTIALS_DIR:../../../.local/tenants}
  gitops:
    api-url: https://api.github.com
    repo: ${GITOPS_REPO:bbbbb0413/ai-agent-capstone}
    token: ${GITHUB_TOKEN:}
    merge-timeout: 30m   # 이 시간 안에 PR이 병합·동기화되지 않으면 에스컬레이션한다

management:
  endpoints:
    web:
      exposure:
        include: health
