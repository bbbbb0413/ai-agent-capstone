spring:
  application:
    name: opslens-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/opslens}
    username: ${SPRING_DATASOURCE_USERNAME:opslens_app}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  flyway:
    schemas: app
    default-schema: app
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  mvc:
    async:
      request-timeout: -1   # SSE 연결은 작업이 끝날 때까지 유지한다

server:
  error:
    include-message: always   # 내부 API 오류 메시지를 business-mcp가 ToolError로 모델에 넘긴다

opslens:
  jwt-secret: ${JWT_SECRET:}
  jwt-ttl: 8h
  service-token: ${SERVICE_TOKEN:}
  alert-webhook-token: ${ALERT_WEBHOOK_TOKEN:}
  agent-url: ${AGENT_URL:http://localhost:8000}
  prometheus-url: http://prometheus:9090   # 의존 대상 상태(get_dependency_health) 조회. compose 내부 주소
  dispatch-mode: ${DISPATCH_MODE:http}   # http | kafka
  auto-approve-allowed: ${AUTO_APPROVE_ALLOWED:true}   # true면 관리자가 화면에서 자동 승인을 켤 수 있다. 운영에서는 false
  kubernetes:
    credentials-dir: ${TENANT_CREDENTIALS_DIR:../../../.local/tenants}
  gitops:
    api-url: https://api.github.com
    repo: ${GITOPS_REPO:bbbbb0413/ai-agent-capstone}
    token: ${GITHUB_TOKEN:}
    merge-timeout: 30m   # 이 시간 안에 PR이 병합·동기화되지 않으면 에스컬레이션한다

management:
  endpoints:
    web:
      exposure:
        include: health
