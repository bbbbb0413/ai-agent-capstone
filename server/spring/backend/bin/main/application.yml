spring:
  application:
    name: opslens-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/opslens}
    username: ${SPRING_DATASOURCE_USERNAME:opslens_app}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  flyway:
    schemas: app
    default-schema: app
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  mvc:
    async:
      request-timeout: -1   # SSE 연결은 작업이 끝날 때까지 유지한다

server:
  error:
    include-message: always   # 내부 API 오류 메시지를 business-mcp가 ToolError로 모델에 넘긴다

opslens:
  jwt-secret: ${JWT_SECRET:}
  jwt-ttl: 8h
  service-token: ${SERVICE_TOKEN:}
  alert-webhook-token: ${ALERT_WEBHOOK_TOKEN:}
  agent-url: ${AGENT_URL:http://localhost:8000}
  dispatch-mode: ${DISPATCH_MODE:http}   # http | kafka

management:
  endpoints:
    web:
      exposure:
        include: health
