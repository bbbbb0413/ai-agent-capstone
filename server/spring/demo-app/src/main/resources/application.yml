spring:
  application:
    name: demo-app
  profiles:
    active: ${DEMO_MODE:app}   # app: 고객사 서비스 | loadgen: 부하 발생기 (traffic 네임스페이스)
  mvc:
    async:
      request-timeout: 60s     # 과부하에서 주문이 슬롯을 오래 기다려도 끊지 않는다 (발생기 timeout 30초)

demo:
  tenant-id: ${TENANT_ID:tenant-local}
  service-name: ${SERVICE_NAME:demo-local}   # 로그의 service 라벨. 서비스 카탈로그의 서비스 이름과 같아야 한다
  admin-token: ${SERVICE_TOKEN:}
  loki-url: ${LOKI_URL:http://localhost:3100/loki/api/v1/push}
  pool-size: ${DEMO_POOL_SIZE:20}   # 20보다 작으면 시작부터 커넥션 풀 고갈 (잘못된 설정 배포 시나리오)
  # 의존 대상 장애(결제 지연, DB 지연). 시작할 때만 읽는다. 고객사 ConfigMap dependency-faults를 마운트한 파일이다
  dependency-faults-file: ${DEMO_DEPENDENCY_FAULTS_FILE:}
  traffic-interval-ms: 200   # 자체 생성 트래픽 주기
  workers: ${DEMO_WORKERS:4}   # 처리 슬롯. 주문 하나가 50ms 안팎 점유해서 파드당 용량은 초당 약 80건
  loadgen:
    target: ${LOADGEN_TARGET:http://localhost:8080/orders}
    rate: ${LOADGEN_RATE:200}            # 초당 요청 수 (응답을 기다리지 않고 일정하게 보낸다)
    # 응답을 기다리는 요청의 상한. 넘으면 그 요청은 보내지 않는다(사용자가 포기). 서버 대기열이 이 수를 넘지 않아
    # 과부하에서도 메모리가 터지지 않고, 지연은 상한 ÷ 처리 용량(B사 300÷80 ≈ 3.8초)에서 멈춘다
    max-in-flight: ${LOADGEN_MAX_IN_FLIGHT:300}

server:
  tomcat:
    keep-alive-timeout: 5s   # 유휴 연결을 오래 쥐지 않는다. 부하 중 연결이 쌓여 파드가 OOMKilled된 적이 있다

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  metrics:
    tags:
      app: demo-app
    distribution:
      percentiles-histogram:
        demo.orders: true   # p95 알림 규칙이 demo_orders_seconds_bucket을 쓴다
        demo.dependency: true   # 의존 대상 상태(backend get_dependency_health)가 p95를 본다
