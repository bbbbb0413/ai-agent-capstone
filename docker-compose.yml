# OpsLens docker compose 초안
# 공개 포트는 frontend(80)와 backend(8080)뿐이다. 나머지는 docker network 안에서만 접근한다.
# 개발 중 Grafana·PostgreSQL을 열어 보려면 docker-compose.dev.yml을 함께 쓴다.
#
#   docker compose up -d --build                         # MVP (작업 전달: HTTP)
#   DISPATCH_MODE=kafka docker compose --profile queue up -d --build   # Kafka 대기열 사용
#   docker compose --profile tools run --rm indexer      # 문서 색인

name: opslens

x-service-token: &service-token
  SERVICE_TOKEN: ${SERVICE_TOKEN:?SERVICE_TOKEN is required}

services:
  # ── 공개 tier ───────────────────────────────────────────────
  frontend:
    build: ./front
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
    build: ./server/spring/backend
    ports:
      - "8080:8080"
    environment:
      <<: *service-token
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/opslens
      SPRING_DATASOURCE_USERNAME: opslens_app
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD:?}
      JWT_SECRET: ${JWT_SECRET:?}
      ALERT_WEBHOOK_TOKEN: ${ALERT_WEBHOOK_TOKEN:?}
      AGENT_URL: http://agent:8000
      DISPATCH_MODE: ${DISPATCH_MODE:-http}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
        required: false

  # ── 내부 AI tier ────────────────────────────────────────────
  agent:
    build: ./server/python/agent
    environment:
      <<: *service-token
      BACKEND_URL: http://backend:8080
      DATABASE_URL: postgresql://opslens_agent:${AGENT_DB_PASSWORD:?}@postgres:5432/opslens
      BUSINESS_MCP_URL: http://business-mcp:9101/mcp
      RAG_MCP_URL: http://rag-mcp:9102/mcp
      GRAFANA_MCP_URL: http://mcp-grafana:9103/mcp
      OPENAI_API_KEY: ${OPENAI_API_KEY:?}
      LLM_MODEL: ${LLM_MODEL:-gpt-5-mini}
      FALLBACK_MODEL: ${FALLBACK_MODEL:-gpt-5-nano}
      DISPATCH_MODE: ${DISPATCH_MODE:-http}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-opslens}
    depends_on:
      postgres:
        condition: service_healthy
      business-mcp:
        condition: service_started
      rag-mcp:
        condition: service_started
      mcp-grafana:
        condition: service_started
      kafka:
        condition: service_started
        required: false

  business-mcp:
    build: ./server/python/business-mcp
    environment:
      <<: *service-token
      BACKEND_URL: http://backend:8080
      PORT: "9101"

  rag-mcp:
    build: ./server/python/rag-mcp
    environment:
      <<: *service-token
      DATABASE_URL: postgresql://opslens_rag:${RAG_DB_PASSWORD:?}@postgres:5432/opslens
      OPENAI_API_KEY: ${OPENAI_API_KEY:?}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      PORT: "9102"
    depends_on:
      postgres:
        condition: service_healthy

  # Grafana Labs 공식 MCP Server. 이미지 기본 전송이 SSE라서 streamable-http를 지정한다.
  mcp-grafana:
    image: grafana/mcp-grafana:2.0.2
    command:
      - -t
      - streamable-http
      - --address
      - 0.0.0.0:9103
      # Host 헤더 검사는 기본이 루프백뿐이라 docker network의 서비스 이름을 허용한다
      - --allowed-hosts
      - mcp-grafana:9103
      - --disable-write
      - --disable-dashboard
      - --disable-incident
      - --disable-oncall
      - --disable-alerting
      - --disable-admin
      - --disable-sql
    environment:
      # 호출자 인증: agent가 Authorization: Bearer <SERVICE_TOKEN>을 실어야 도구를 쓸 수 있다
      MCP_GRAFANA_SERVER_TOKEN: ${SERVICE_TOKEN}
      GRAFANA_URL: http://grafana:3000
      # TODO: Viewer 권한 서비스 계정 토큰(GRAFANA_SERVICE_ACCOUNT_TOKEN)으로 바꾼다
      GRAFANA_USERNAME: admin
      GRAFANA_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
    depends_on:
      - grafana

  indexer:
    build: ./server/python/indexer
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql://opslens_indexer:${INDEXER_DB_PASSWORD:?}@postgres:5432/opslens
      OPENAI_API_KEY: ${OPENAI_API_KEY:?}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1536}
      DOCUMENTS_DIR: /data/documents
    volumes:
      - ./data/documents:/data/documents:ro
    depends_on:
      postgres:
        condition: service_healthy

  # ── 내부 Data tier ──────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:0.8.7-pg16-trixie
    environment:
      POSTGRES_DB: opslens
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:?}
      INDEXER_DB_PASSWORD: ${INDEXER_DB_PASSWORD:?}
      RAG_DB_PASSWORD: ${RAG_DB_PASSWORD:?}
    volumes:
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d opslens"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.2.2
    profiles: ["queue"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

  # ── 관측 스택 (고객사 환경 시뮬레이션) ───────────────────────
  demo-app-a:
    build: ./server/spring/demo-app
    environment:
      <<: *service-token
      TENANT_ID: tenant-a
      LOKI_URL: http://loki:3100/loki/api/v1/push
    depends_on:
      - loki

  demo-app-b:
    build: ./server/spring/demo-app
    environment:
      <<: *service-token
      TENANT_ID: tenant-b
      LOKI_URL: http://loki:3100/loki/api/v1/push
    depends_on:
      - loki

  prometheus:
    image: prom/prometheus:v3.13.4
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro

  # 쿼리에 tenant label을 강제한다. Grafana 데이터소스가 X-Tenant 헤더로 고객사를 지정한다.
  prom-label-proxy:
    image: quay.io/prometheuscommunity/prom-label-proxy:v0.15.1
    command:
      - -header-name=X-Tenant
      - -label=tenant
      - -upstream=http://prometheus:9090
      - -insecure-listen-address=0.0.0.0:8080
    depends_on:
      - prometheus

  alertmanager:
    image: prom/alertmanager:v0.34.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    volumes:
      - ./infra/alertmanager:/etc/alertmanager:ro
    secrets:
      - alert_webhook_token

  loki:
    image: grafana/loki:3.6.18
    command:
      - -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./infra/loki:/etc/loki:ro
      - loki-data:/loki

  grafana:
    image: grafana/grafana:13.0.11
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prom-label-proxy
      - loki

secrets:
  alert_webhook_token:
    environment: ALERT_WEBHOOK_TOKEN

volumes:
  postgres-data:
  loki-data:
