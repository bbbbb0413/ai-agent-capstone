# OpsLens docker compose 초안
# 공개 포트는 frontend(80)와 backend(8080)뿐이다. 나머지는 docker network 안에서만 접근한다.
# 개발 중 Grafana·PostgreSQL을 열어 보려면 docker-compose.dev.yml을 함께 쓴다.
#
#   docker compose up -d --build                         # 기본 (작업 전달: Kafka 대기열)
#   DISPATCH_MODE=http docker compose up -d --build      # Kafka 없이 HTTP로 바로 전달 (원인을 좁힐 때)
#   docker compose --profile tools run --rm indexer      # 문서 색인

name: opslens

# 내부 호출 토큰은 호출마다 따로 둔다 (docs/specs/SPEC-limitations-fixes.md 3단계). 서비스마다 필요한 것만 받는다.
# 모두 필수이고, 값이 서로 같으면 backend가 기동하지 않는다.

services:
  # ── 공개 tier ───────────────────────────────────────────────
  frontend:
    build: ./front
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
    build: ./server/spring/backend
    ports:
      - "8080:8080"
    environment:
      # 보내는 토큰: backend → agent. 나머지는 backend가 받아서 경로별로 검사한다 (ServiceTokenFilter)
      BACKEND_AGENT_TOKEN: ${BACKEND_AGENT_TOKEN:?}
      AGENT_BACKEND_TOKEN: ${AGENT_BACKEND_TOKEN:?}
      MCP_BACKEND_TOKEN: ${MCP_BACKEND_TOKEN:?}
      INDEXER_BACKEND_TOKEN: ${INDEXER_BACKEND_TOKEN:?}
      GITOPS_WEBHOOK_TOKEN: ${GITOPS_WEBHOOK_TOKEN:?}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/opslens
      SPRING_DATASOURCE_USERNAME: opslens_app
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD:?}
      JWT_SECRET: ${JWT_SECRET:?}
      SLACK_ENCRYPTION_KEY: ${SLACK_ENCRYPTION_KEY:-}
      ALERT_WEBHOOK_TOKEN: ${ALERT_WEBHOOK_TOKEN:?}
      AGENT_URL: http://agent:8000
      DISPATCH_MODE: ${DISPATCH_MODE:-kafka}
      AUTO_APPROVE_ALLOWED: ${AUTO_APPROVE_ALLOWED:-true}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_PARTITIONS: ${KAFKA_PARTITIONS:-3}
      # 고객사 조치 반영 (ADR 0001). 고객사 자격증명은 backend만 가진다
      TENANT_CREDENTIALS_DIR: /run/opslens/tenants
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      # scripts/cluster-up.sh가 만든 고객사별 ServiceAccount 토큰과 클러스터 CA
      - ./.local/tenants:/run/opslens/tenants:ro
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
        required: false

  # ── 내부 AI tier ────────────────────────────────────────────
  # agent 스키마 마이그레이션 (Alembic + LangGraph checkpointer 표). agent보다 먼저 한 번 돌고 끝난다.
  # agent를 여러 개 띄워도 DDL은 여기서만 한다 (SPEC-kafka-scale 4.3(8))
  agent-migrate:
    build: ./server/python/agent
    command: ["/app/.venv/bin/python", "-m", "agent.migrate"]
    environment:
      DATABASE_URL: postgresql://opslens_agent:${AGENT_DB_PASSWORD:?}@postgres:5432/opslens
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  agent:
    build: ./server/python/agent
    environment:
      BACKEND_AGENT_TOKEN: ${BACKEND_AGENT_TOKEN:?}   # backend → agent 요청 검사
      AGENT_BACKEND_TOKEN: ${AGENT_BACKEND_TOKEN:?}   # agent → backend
      AGENT_MCP_TOKEN: ${AGENT_MCP_TOKEN:?}           # agent → MCP Server
      BACKEND_URL: http://backend:8080
      DATABASE_URL: postgresql://opslens_agent:${AGENT_DB_PASSWORD:?}@postgres:5432/opslens
      BUSINESS_MCP_URL: http://business-mcp:9101/mcp
      RAG_MCP_URL: http://rag-mcp:9102/mcp
      GRAFANA_MCP_URL: http://mcp-grafana:9103/mcp
      OPENAI_API_KEY: ${OPENAI_API_KEY:?}
      LLM_MODEL: ${LLM_MODEL:-gpt-5-mini}
      FALLBACK_MODEL: ${FALLBACK_MODEL:-gpt-5-nano}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT-low}
      DIAGNOSE_FORCE_FIRST_TOOL: ${DIAGNOSE_FORCE_FIRST_TOOL:-true}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      TYPESAFE_MIN_CONFIDENCE: ${TYPESAFE_MIN_CONFIDENCE:-0.9}
      DISPATCH_MODE: ${DISPATCH_MODE:-kafka}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-opslens}
      AGENT_CONSUMER_ROLE: ${AGENT_CONSUMER_ROLE:-all}
    depends_on:
      postgres:
        condition: service_healthy
      agent-migrate:
        condition: service_completed_successfully
      business-mcp:
        condition: service_started
      rag-mcp:
        condition: service_started
      mcp-grafana:
        condition: service_started
      kafka:
        condition: service_healthy
        required: false

  business-mcp:
    build: ./server/python/business-mcp
    environment:
      AGENT_MCP_TOKEN: ${AGENT_MCP_TOKEN:?}       # agent → business-mcp 요청 검사
      MCP_BACKEND_TOKEN: ${MCP_BACKEND_TOKEN:?}   # business-mcp → backend
      BACKEND_URL: http://backend:8080
      PORT: "9101"

  rag-mcp:
    build: ./server/python/rag-mcp
    environment:
      AGENT_MCP_TOKEN: ${AGENT_MCP_TOKEN:?}       # agent → rag-mcp 요청 검사
      MCP_BACKEND_TOKEN: ${MCP_BACKEND_TOKEN:?}   # 작업 토큰 공개키 조회 (backend)
      BACKEND_URL: http://backend:8080
      DATABASE_URL: postgresql://opslens_rag:${RAG_DB_PASSWORD:?}@postgres:5432/opslens
      OPENAI_API_KEY: ${OPENAI_API_KEY:?}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      PORT: "9102"
    depends_on:
      postgres:
        condition: service_healthy

  # Grafana Labs 공식 MCP Server. 이미지 기본 전송이 SSE라서 streamable-http를 지정한다.
  mcp-grafana:
    image: grafana/mcp-grafana:2.0.2
    command:
      - -t
      - streamable-http
      - --address
      - 0.0.0.0:9103
      # Host 헤더 검사는 기본이 루프백뿐이라 docker network의 서비스 이름을 허용한다
      - --allowed-hosts
      - mcp-grafana:9103
      - --disable-write
      - --disable-dashboard
      - --disable-incident
      - --disable-oncall
      - --disable-alerting
      - --disable-admin
      - --disable-sql
    environment:
      # 호출자 인증: agent가 Authorization: Bearer <AGENT_MCP_TOKEN>을 실어야 도구를 쓸 수 있다
      MCP_GRAFANA_SERVER_TOKEN: ${AGENT_MCP_TOKEN:?}
      GRAFANA_URL: http://grafana:3000
      # TODO: Viewer 권한 서비스 계정 토큰(GRAFANA_SERVICE_ACCOUNT_TOKEN)으로 바꾼다
      GRAFANA_USERNAME: admin
      GRAFANA_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
    depends_on:
      - grafana

  indexer:
    build: ./server/python/indexer
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql://opslens_indexer:${INDEXER_DB_PASSWORD:?}@postgres:5432/opslens
      OPENAI_API_KEY: ${OPENAI_API_KEY:?}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1536}
      DOCUMENTS_DIR: /data/documents
    volumes:
      - ./data/documents:/data/documents:ro
    depends_on:
      postgres:
        condition: service_healthy

  # 장애 보고서 → RAG. 정적 문서 색인과 같은 이미지·DB 쓰기 계정을 사용한다.
  postmortem-indexer:
    build: ./server/python/indexer
    command: ["/app/.venv/bin/python", "-m", "indexer.postmortems", "--watch"]
    restart: unless-stopped
    environment:
      INDEXER_BACKEND_TOKEN: ${INDEXER_BACKEND_TOKEN:?}   # 회고 경로에만 통한다
      BACKEND_URL: http://backend:8080
      DATABASE_URL: postgresql://opslens_indexer:${INDEXER_DB_PASSWORD:?}@postgres:5432/opslens
      OPENAI_API_KEY: ${OPENAI_API_KEY:?}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1536}
      DOCUMENTS_DIR: /data/documents
      POSTMORTEM_TENANTS: ${POSTMORTEM_TENANTS:-}
    volumes:
      - ./data/documents:/data/documents:ro
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started

  # ── 내부 Data tier ──────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:0.8.7-pg16-trixie
    environment:
      POSTGRES_DB: opslens
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:?}
      INDEXER_DB_PASSWORD: ${INDEXER_DB_PASSWORD:?}
      RAG_DB_PASSWORD: ${RAG_DB_PASSWORD:?}
    volumes:
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d opslens"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.2.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: ${KAFKA_PARTITIONS:-3}   # 자동 생성 토픽도 backend가 만드는 작업 토픽과 같게
    # backend가 기동할 때 작업 토픽을 만들고 agent가 구독하므로, 브로커가 요청을 받을 수 있을 때 healthy다
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  # ── 관측 스택 ───────────────────────────────────────────
  # 고객사 서비스는 kind 클러스터(gitops/)에서 돈다. 메트릭은 클러스터 안 수집기가 remote write로 보낸다.
  prometheus:
    image: prom/prometheus:v3.13.4
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro

  # 쿼리에 tenant label을 강제한다. Grafana 데이터소스가 X-Tenant 헤더로 고객사를 지정한다.
  prom-label-proxy:
    image: quay.io/prometheuscommunity/prom-label-proxy:v0.15.1
    command:
      - -header-name=X-Tenant
      - -label=tenant
      # Grafana Explore의 메트릭·라벨 목록(/api/v1/labels, /api/v1/label/*/values)에도 tenant를 강제해 허용한다
      - -enable-label-apis
      - -upstream=http://prometheus:9090
      - -insecure-listen-address=0.0.0.0:8080
    depends_on:
      - prometheus

  alertmanager:
    image: prom/alertmanager:v0.34.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    volumes:
      - ./infra/alertmanager:/etc/alertmanager:ro
    secrets:
      - alert_webhook_token

  loki:
    image: grafana/loki:3.6.18
    command:
      - -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./infra/loki:/etc/loki:ro
      - loki-data:/loki

  grafana:
    image: grafana/grafana:13.0.11
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prom-label-proxy
      - loki

secrets:
  alert_webhook_token:
    environment: ALERT_WEBHOOK_TOKEN

volumes:
  postgres-data:
  loki-data:
