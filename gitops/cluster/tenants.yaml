# 고객사 네임스페이스와 고객사별 OpsLens 권한.
# OpsLens backend는 작업의 고객사에 해당하는 ServiceAccount 토큰만 쓴다.
# 실제 클라우드라면 고객사 계정의 역할을 임시로 빌리는 방식(AssumeRole)이 이 자리에 들어간다.
apiVersion: v1
kind: Namespace
metadata:
  name: tenant-a
  labels:
    opslens.io/tenant: tenant-a
    opslens.io/change-mode: GITOPS
---
apiVersion: v1
kind: Namespace
metadata:
  name: tenant-b
  labels:
    opslens.io/tenant: tenant-b
    opslens.io/change-mode: DIRECT
---
# 허용 조치: 파드 재시작(파드 삭제), Deployment 확장·롤백·재시작.
# 계약상 허용 여부는 backend가 먼저 판단하고, 이 Role은 그 위의 두 번째 제한이다.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opslens-operator
  namespace: tenant-a
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, delete]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, deployments/scale]
    verbs: [patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opslens-operator
  namespace: tenant-b
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, delete]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, deployments/scale]
    verbs: [patch, update]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opslens-operator
  namespace: tenant-a
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opslens-operator
  namespace: tenant-b
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opslens-operator
  namespace: tenant-a
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: opslens-operator
subjects:
  - kind: ServiceAccount
    name: opslens-operator
    namespace: tenant-a
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opslens-operator
  namespace: tenant-b
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: opslens-operator
subjects:
  - kind: ServiceAccount
    name: opslens-operator
    namespace: tenant-b
---
# 오래 쓰는 토큰. scripts/cluster-up.sh가 꺼내 .local/tenants/<tenant>.token 에 저장한다
apiVersion: v1
kind: Secret
metadata:
  name: opslens-operator-token
  namespace: tenant-a
  annotations:
    kubernetes.io/service-account.name: opslens-operator
type: kubernetes.io/service-account-token
---
apiVersion: v1
kind: Secret
metadata:
  name: opslens-operator-token
  namespace: tenant-b
  annotations:
    kubernetes.io/service-account.name: opslens-operator
type: kubernetes.io/service-account-token
