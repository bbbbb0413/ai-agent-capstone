# 장애용 데모 서비스 (SPEC-e2e-speed 8.1). reservation-api.yaml와 같은 데모 앱이고 이름만 다르다
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkin-api
  labels:
    app: checkin-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkin-api
  template:
    metadata:
      labels:
        app: checkin-api
    spec:
      containers:
        - name: checkin-api
          image: opslens/demo-app:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: TENANT_ID
              value: tenant-b
            # 로그의 service 라벨 (서비스 카탈로그의 서비스 이름)
            - name: SERVICE_NAME
              value: checkin-api
            - name: LOKI_URL
              value: http://loki:3100/loki/api/v1/push
            - name: SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: demo-app-admin
                  key: token
            # 의존 대상 장애(결제 지연, DB 지연). 재시작해도 남게 파드 밖(ConfigMap)에 둔다. 시작할 때만 읽는다
            - name: DEMO_DEPENDENCY_FAULTS_FILE
              value: /etc/demo-faults/dependency-faults
          volumeMounts:
            - name: dependency-faults
              mountPath: /etc/demo-faults
              readOnly: true
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 512Mi }   # 부하 중 최대 약 340Mi를 썼다 (스펙 5.6 실측)
      volumes:
        # scripts/inject.py가 만든다. 설정 저장소에 두지 않는다(ArgoCD가 관리하지 않는다). 없으면 장애 없음
        - name: dependency-faults
          configMap:
            name: dependency-faults-checkin-api   # 서비스마다 따로 (다른 서비스의 의존 장애가 옮겨 가지 않게)
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: checkin-api
spec:
  # OpsLens backend(compose)가 kind 노드 이름과 이 포트로 서비스 관리 API에 닿는다
  type: NodePort
  selector:
    app: checkin-api
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30085
