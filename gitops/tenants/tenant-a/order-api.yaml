apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-api
  labels:
    app: order-api
spec:
  # replicas는 두지 않는다. HPA(hpa.yaml)가 2~최대치 사이에서 정한다. 두면 ArgoCD 동기화가 HPA의 값을 덮어쓴다
  selector:
    matchLabels:
      app: order-api
  template:
    metadata:
      labels:
        app: order-api
    spec:
      containers:
        - name: order-api
          image: opslens/demo-app:0.1.0
          imagePullPolicy: IfNotPresent   # kind에 미리 올린 로컬 이미지를 쓴다
          ports:
            - containerPort: 8080
          env:
            - name: TENANT_ID
              value: tenant-a
            # 로그의 service 라벨 (서비스 카탈로그의 서비스 이름)
            - name: SERVICE_NAME
              value: order-api
            - name: LOKI_URL
              value: http://loki:3100/loki/api/v1/push
            # 커넥션 풀 크기. 20보다 작으면 커넥션 풀이 고갈된다 (시나리오 A: 잘못된 설정 배포)
            - name: DEMO_POOL_SIZE
              value: "20"
            - name: SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: demo-app-admin
                  key: token
            # 의존 대상 장애(결제 지연, DB 지연). 재시작해도 남게 파드 밖(ConfigMap)에 둔다. 시작할 때만 읽는다
            - name: DEMO_DEPENDENCY_FAULTS_FILE
              value: /etc/demo-faults/dependency-faults
          volumeMounts:
            - name: dependency-faults
              mountPath: /etc/demo-faults
              readOnly: true
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 192Mi }   # HPA CPU 사용률의 기준
            limits: { memory: 512Mi }   # 부하 중 최대 약 340Mi를 썼다 (스펙 5.6 실측)
      volumes:
        # scripts/inject.py가 만든다. 설정 저장소에 두지 않는다(ArgoCD가 관리하지 않는다). 없으면 장애 없음
        - name: dependency-faults
          configMap:
            name: dependency-faults
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: order-api
spec:
  # OpsLens backend(compose)가 kind 노드 이름과 이 포트로 서비스 관리 API에 닿는다
  type: NodePort
  selector:
    app: order-api
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30081
