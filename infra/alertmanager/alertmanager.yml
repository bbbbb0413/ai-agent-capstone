route:
  receiver: opslens-backend
  group_by: [tenant, alertname]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 30m

receivers:
  - name: opslens-backend
    webhook_configs:
      - url: http://backend:8080/internal/alerts
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /run/secrets/alert_webhook_token
