route:
  receiver: opslens-backend
  # 서비스마다 따로 묶는다. 같은 고객사의 다른 서비스 알림이 앞 묶음에 들어가 group_interval만큼 늦게 오지 않게 한다.
  # 데모 환경은 장애를 바로 넣고 빼므로 짧게 둔다. 해제 알림도 group_interval마다 오므로 인시던트가 빨리 닫힌다
  # (SPEC-e2e-speed ⑤). 실제 고객사에 적용할 값은 고객사별로 정한다
  group_by: [tenant, service, alertname]
  group_wait: 5s
  group_interval: 20s
  repeat_interval: 30m

receivers:
  - name: opslens-backend
    webhook_configs:
      - url: http://backend:8080/internal/alerts
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /run/secrets/alert_webhook_token
