global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

# 고객사 서비스 메트릭은 kind 클러스터의 수집기(gitops/cluster/metrics-agent.yaml)가
# tenant·service 라벨을 붙여 remote write로 보낸다. 여기서 직접 수집하는 대상은 없다.
