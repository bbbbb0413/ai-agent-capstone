global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # tenant label은 prom-label-proxy가 고객사별 조회 범위를 강제할 때 쓴다
  - job_name: demo-app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["demo-app-a:8080"]
        labels:
          tenant: tenant-a
          service: order-api
      - targets: ["demo-app-b:8080"]
        labels:
          tenant: tenant-b
          service: reservation-api
