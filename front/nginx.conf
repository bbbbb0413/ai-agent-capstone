# backend 컨테이너가 다시 만들어지면 IP가 바뀔 수 있다.
# upstream의 resolve(nginx 1.27.3+)로 주소를 주기적으로 다시 찾는다. 127.0.0.11은 Docker 내부 DNS다
resolver 127.0.0.11 valid=10s ipv6=off;

upstream backend_api {
    zone backend_api 64k;
    server backend:8080 resolve;
    keepalive 16;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    # 같은 출처로 /api를 넘겨 HttpOnly 쿠키 인증과 SSE를 그대로 쓴다
    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;          # SSE 이벤트를 모으지 않고 바로 보낸다
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
